<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Médica | Panel</title>
<meta name="theme-color" content="#2d6cdf">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="contenedor-principal">
        <header class="header" id="header"></header>
        <main class="contenido" id="contenido" role="main"></main>
    </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-contenido" id="modalContenido">
        <div class="modal-header">
            <h3 id="modalTitulo"></h3>
            <button type="button" class="modal-cerrar" id="modalCerrar" aria-label="Cerrar">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<div class="modal" id="modalConfirmar" role="dialog" aria-modal="true">
    <div class="modal-contenido modal-pequeno">
        <div class="modal-header"><h3 id="confirmarTitulo">Confirmar</h3></div>
        <div class="modal-body"><p id="confirmarMensaje"></p></div>
        <div class="modal-footer">
            <button class="btn btn-secundario" id="confirmarNo">Cancelar</button>
            <button class="btn btn-peligro" id="confirmarSi">Confirmar</button>
        </div>
    </div>
</div>

<div class="modal" id="modalDenegado" role="dialog" aria-modal="true">
    <div class="modal-contenido modal-pequeno">
        <div class="modal-header"><h3>Acceso denegado</h3></div>
        <div class="modal-body">
            <div style="text-align:center;padding:14px 0">
                <div style="font-size:48px;margin-bottom:12px">🚫</div>
                <p style="font-weight:600;color:var(--text);margin-bottom:6px">No tienes permisos para acceder aquí</p>
                <p style="font-size:13px">Esta sección es exclusiva del Administrador.</p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primario" onclick="document.getElementById('modalDenegado').classList.remove('activo');App.navegar('dashboard')">Volver al inicio</button>
        </div>
    </div>
</div>

<!-- Modal de búsqueda global -->
<div class="modal" id="modalBusqueda" role="dialog" aria-modal="true">
    <div class="modal-contenido modal-busqueda">
        <div class="modal-header">
            <h3>Búsqueda global</h3>
            <button type="button" class="modal-cerrar" onclick="document.getElementById('modalBusqueda').classList.remove('activo')" aria-label="Cerrar">✕</button>
        </div>
        <div class="modal-body">
            <div class="busqueda-grande">
                <i data-lucide="search" style="width:20px;height:20px"></i>
                <input type="text" id="busquedaGlobalInput" placeholder="Buscar pacientes, consultas, recetas..." autocomplete="off">
                <kbd>ESC</kbd>
            </div>
            <div id="resultadosBusqueda" class="resultados-busqueda"></div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/modulos/dashboard.js"></script>
<script src="js/modulos/pacientes.js"></script>
<script src="js/modulos/citas.js"></script>
<script src="js/modulos/consultas.js"></script>
<script src="js/modulos/recetas.js"></script>
<script src="js/modulos/historia.js"></script>
<script src="js/modulos/usuarios.js"></script>
<script src="js/modulos/configuracion.js"></script>
<script src="js/modulos/perfil.js"></script>
<script src="js/app.js"></script>
</body>
</html>
